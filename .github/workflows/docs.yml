name: Documentation

on:
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs_hooks.py"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/libsy/**"
      - "crates/protocol/**"
      - ".github/workflows/docs.yml"
  push:
    branches: [conductorone/main]
    paths:
      - "docs/**"
      - "mkdocs_hooks.py"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/libsy/**"
      - "crates/protocol/**"
      - ".github/workflows/docs.yml"

# Cancel superseded runs for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MKDOCS_SOURCE_REF: ${{ github.event.pull_request.head.sha || github.sha }}

permissions:
  contents: read

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --only-group docs --locked
      - name: Build documentation
        run: uv run --only-group docs mkdocs build --strict
      - name: Build Rust crate documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: >-
          cargo doc --locked --no-deps
          --package switchyard-libsy
          --package switchyard-protocol
      - name: Add crate documentation to site
        run: |
          mkdir -p site/rust
          cp -R target/doc/. site/rust/
